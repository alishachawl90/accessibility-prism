<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Prism</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      color-scheme: light;
      text-transform: none;
    }

    /* ── Design tokens ──────────────────────────────────────────────────── */
    :root {
      --surface: #FFFFFF;
      --bg-subtle: #F9FAFB;
      --border: #E5E7EB;
      --border-light: #F3F4F6;
      --text-primary: #1F2937;
      --text-secondary: #374151;
      --text-muted: #6B7280;
      --color-error: #DC2626;
      --color-error-bg: #FEF2F2;
      --color-warning: #B45309;
      --color-warning-bg: #FFFBEB;
      --color-info: #1D4ED8;
      --color-info-bg: #EFF6FF;
      --color-success: #15803D;
      --color-success-bg: #F0FDF4;
      --color-accent: #4F46E5;
      --color-accent-bg: #EEF2FF;

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                   Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      background-color: var(--surface);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-align: left;
    }

    /* ── Panel root fills the popup window ─────────────────────────────── */
    html, body {
      height: 100%;
    }
    #a11y-analyzer-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 0;
    }

    /* ── Typography resets (p/h tags only — NOT div, which would beat class selectors) ── */
    #a11y-analyzer-panel p,
    #a11y-analyzer-panel h2,
    #a11y-analyzer-panel h3,
    #a11y-analyzer-panel label {
      margin: 0;
      padding: 0;
    }

    #a11y-analyzer-panel button {
      font-family: inherit;
      line-height: 1.5;
    }
    #a11y-analyzer-panel button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    #a11y-analyzer-panel input,
    #a11y-analyzer-panel select {
      font-family: inherit;
      line-height: 1.5;
    }
    #a11y-analyzer-panel input::placeholder { color: var(--text-muted); }
    #a11y-analyzer-panel code {
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    #a11y-analyzer-panel a            { color: var(--color-info); text-decoration: underline; }
    #a11y-analyzer-panel a:hover      { color: #1E40AF; }
    #a11y-analyzer-panel svg          { color: inherit; }
    #a11y-analyzer-panel .acc-header:hover { background: var(--bg-subtle); }

    /* ── Utility classes ────────────────────────────────────────────────── */
    .a11y-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .a11y-card:hover { border-color: var(--color-accent); }

    .a11y-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.5;
    }
    .a11y-badge-sm {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .a11y-panel-title    { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; color: white; }
    .a11y-scroll-area    { padding: 14px 16px; background: var(--bg-subtle); overflow-y: auto; flex: 1; }
    .a11y-header-bar     { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 16px; font-size: 13px; font-weight: 600; align-items: center; }
    .a11y-section-title  { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .a11y-text-primary   { color: var(--text-primary); }
    .a11y-text-secondary { color: var(--text-secondary); }
    .a11y-text-muted     { color: var(--text-muted); }
    .a11y-flex-center    { display: flex; align-items: center; }
    .a11y-flex-between   { display: flex; align-items: center; justify-content: space-between; }
    .a11y-code           { font-size: 11px; color: var(--text-muted); background: var(--border-light); padding: 1px 6px; border-radius: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .a11y-text-error     { color: var(--color-error); }
    .a11y-text-warning   { color: var(--color-warning); }
    .a11y-text-success   { color: var(--color-success); }
    .a11y-text-info      { color: var(--color-info); }
    .a11y-empty-success  { text-align: center; padding: 24px; color: var(--color-success); font-size: 14px; font-weight: 500; }
    .a11y-empty-state    { text-align: center; padding: 24px; color: var(--text-muted); font-size: 14px; }

    /* Loading spinner */
    @keyframes a11y-spin { to { transform: rotate(360deg); } }
    .a11y-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: a11y-spin 0.7s linear infinite;
    }

    .a11y-card-header  { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .a11y-card-desc    { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .a11y-card-title   { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

    .a11y-sev-chip {
      padding: 5px 10px;
      border: 1.5px solid #D1D5DB;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      background: white;
      color: var(--text-muted);
      font-weight: 600;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .a11y-issue-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .a11y-issue-card:hover { border-color: var(--color-accent); }

    .a11y-card-body {
      padding: 10px 14px;
      border-top: 1px solid #F3F4F6;
      background: #FAFAFA;
    }
    .a11y-card-chevron  { transition: transform 0.2s; flex-shrink: 0; color: var(--text-muted); }

    .a11y-highlight-btn {
      padding: 6px 12px;
      background: var(--color-accent-bg);
      border: 1px solid #C7D2FE;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--color-accent);
      font-weight: 500;
      transition: all 0.15s;
    }
    .a11y-highlight-btn:hover { background: #E0E7FF; }

    /* Header icon buttons — replaces blocked inline onmouseover/onmouseout */
    .a11y-hdr-btn:hover { background: rgba(255,255,255,0.2) !important; color: white !important; }
    .a11y-hdr-btn-close:hover { background: rgba(239,68,68,0.35) !important; color: white !important; }
    .a11y-hdr-btn-export-popup:hover { background: rgba(255,255,255,0.15) !important; }

    /* Pre-screen audit card buttons — dynamic hover via CSS custom property */
    .a11y-audit-btn:hover {
      border-color: var(--audit-btn-hover, #6366F1) !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12) !important;
    }

    /* Scorecard export button */
    .a11y-export-scorecard-btn:hover { background: #1D4ED8 !important; }

    .a11y-stats-strip {
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      font-weight: 600;
      align-items: center;
    }

    .a11y-search-input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      color: var(--text-primary);
      background: white;
      transition: border-color 0.15s;
    }
    .a11y-search-input:focus { border-color: var(--color-accent); }

    .a11y-group-tab {
      padding: 6px 14px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      background: white;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .a11y-group-tab[data-active="true"] {
      border-color: var(--color-accent);
      background: var(--color-accent-bg);
      color: var(--color-accent);
      font-weight: 600;
    }

    .a11y-chip-row {
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .a11y-toolbar-row {
      padding: 8px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .a11y-code-block {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
      margin-bottom: 6px;
    }
    .a11y-selector-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <script src="panel.js"></script>
</body>
</html>
